[platformio]
default_envs = release
globallib_dir = lib      ;
workspace_dir = piobuild ;

[env]
platform = ststm32
board = genericSTM32F103VD
framework = cmsis
upload_protocol = stlink
debug_tool = stlink

platform_packages =
    toolchain-gccarmnoneeabi@~1.120301.0

[env:release]
; ** Most of these are PIO defaults, but repeat here for reference **
build_flags =
	-std=c++20
	-fno-rtti
	-fno-exceptions
	-fno-use-cxa-atexit
	-ffunction-sections
	-fdata-sections
	-mthumb
	-mcpu=cortex-m3
	-mfloat-abi=soft
	-march=armv7-m
	-Wall
	-Os
	-I${platformio.packages_dir}/framework-stm32cube/f1/Drivers/CMSIS/Device/ST/STM32F1xx/Include
;	'-D' 'STM32F103xE'
;	'-D' 'STM32F1'
;	'-D' 'GENERIC_F103VX'


[env:debug]
build_type = debug
; ** Most of these are PIO defaults, but repeat here for reference **
build_flags =
	-std=c++20
	-fno-rtti
	-fno-exceptions
	-fno-use-cxa-atexit
	-ffunction-sections
	-fdata-sections
	-mthumb
	-mcpu=cortex-m3
	-mfloat-abi=soft
	-march=armv7-m
	-Wall
	-Og
	-g2
	-ggdb2	
    -v
    -Wl,--verbose
    -I${platformio.packages_dir}/framework-stm32cube/f1/Drivers/CMSIS/Device/ST/STM32F1xx/Include
;	'-D' 'STM32F103xE'
;	'-D' 'STM32F1'
;	'-D' 'GENERIC_F103VX'
